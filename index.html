<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f2ec">
  <meta name="description" content="Cartão virtual da Dra. Thainara Nobre — Clínica Geral e Ortodontia.">
  <title>Drª Thainara Nobre | Odontologia</title>
  <style>
    :root { --bg:#faf6f1; --card:#fffdfb; --rose:#b78375; --text:#4c382e; --line:#e6d4c8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:28px 16px; background:linear-gradient(145deg,#f7eee7,#fffdfb 55%,#f1e2d8); color:var(--text); font-family:Arial,Helvetica,sans-serif; display:flex; justify-content:center; align-items:center; }
    main { width:100%; max-width:460px; text-align:center; }
    .panel { background:rgba(255,253,251,.92); border:1px solid var(--line); border-radius:26px; padding:22px; box-shadow:0 16px 45px rgba(104,72,56,.10); }
    .logo { width:100%; display:block; border-radius:14px; margin:0 auto 20px; }
    h1 { font-family:Georgia,serif; font-weight:normal; font-size:29px; margin:10px 0 6px; color:#a97467; }
    .subtitle { margin:0 0 22px; letter-spacing:2px; text-transform:uppercase; font-size:12px; line-height:1.8; }
    .links { display:grid; gap:12px; }
    a.link { display:flex; align-items:center; gap:13px; text-align:left; padding:15px 16px; text-decoration:none; color:var(--text); background:#fffdfa; border:1px solid var(--line); border-radius:17px; transition:transform .15s,background .15s; }
    a.link:hover { transform:translateY(-2px); background:#fdf5ef; }
    .icon { flex:0 0 42px; height:42px; display:grid; place-items:center; border-radius:50%; background:#c7a28c; color:white; font-size:21px; }
    .link strong { display:block; font-size:15px; font-weight:600; margin-bottom:4px; }
    .link small { display:block; font-size:13px; color:#765d50; line-height:1.45; }
    .footer { font-size:12px; line-height:1.8; color:#8a6c5d; margin:18px 0 0; }
    @media (max-width:380px) { .panel{padding:16px} h1{font-size:25px} a.link{padding:12px} }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <img class="logo" src="cartao-thainara.png" alt="Cartão visual da Drª Thainara Nobre">
      <h1>Drª Thainara Nobre</h1>
      <p class="subtitle">Clínica Geral · Ortodontia</p>
      <nav class="links" aria-label="Contato">
        <a class="link" href="https://wa.me/5569999374058" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">◉</span>
          <span><strong>WhatsApp</strong><small>(69) 99937-4058</small></span>
        </a>
        <a class="link" href="https://instagram.com/dra.thainara_nobre" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">◎</span>
          <span><strong>Instagram</strong><small>@dra.thainara_nobre</small></span>
        </a>
        <a class="link" href="https://www.google.com/maps/search/?api=1&query=Rua+Inglaterra%2C+4698%2C+Jardim+Europa" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">⌖</span>
          <span><strong>Localização</strong><small>Rua Inglaterra, 4698 · Jardim Europa</small></span>
        </a>
      </nav>
      <p class="footer">Odontologia com cuidado, atenção e carinho.<br>Seu sorriso, minha prioridade.</p>
    </section>
  </main>
</body>
</html>
